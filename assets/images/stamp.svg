<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <path id="textCircleOuter" d="M 150,150 m -115,0 a 115,115 0 1,1 230,0 a 115,115 0 1,1 -230,0" />
    <path id="textCircleInner" d="M 150,150 m 85,0 a 85,85 0 1,1 -170,0 a 85,85 0 1,1 170,0" />
  </defs>
  
  <!-- Outer Double Circles -->
  <circle cx="150" cy="150" r="140" fill="none" stroke="#0C4A6E" stroke-width="4" stroke-dasharray="10,4" />
  <circle cx="150" cy="150" r="132" fill="none" stroke="#0284C7" stroke-width="2" />
  <circle cx="150" cy="150" r="95" fill="none" stroke="#0284C7" stroke-width="2" />
  
  <!-- Circular Arabic Text -->
  <text font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369A1">
    <textPath href="#textCircleOuter" startOffset="25%" text-anchor="middle">
      ★ شركة أبو حذيفة للصرافة والتحويلات ★
    </textPath>
  </text>
  <text font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="14" font-weight="600" fill="#0284C7">
    <textPath href="#textCircleOuter" startOffset="75%" text-anchor="middle">
      الإدارة العامة • الشؤون الإدارية والموارد البشرية
    </textPath>
  </text>
  
  <!-- Center Emblem -->
  <g transform="translate(150, 142) scale(0.65)">
    <polygon points="0,-35 30,-5 20,35 -20,35 -30,-5" fill="none" stroke="#0284C7" stroke-width="4" />
    <text x="0" y="5" font-family="'IBM Plex Sans Arabic', Arial, sans-serif" font-size="18" font-weight="900" fill="#0369A1" text-anchor="middle">معتمد</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0284C7" text-anchor="middle">APPROVED</text>
  </g>
  
  <!-- Stamp Date & Stars -->
  <text x="150" y="205" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369A1" text-anchor="middle">C.R: 108492048 / YEMEN</text>
</svg>