name: Deploy to GitHub Pages with Supabase Secrets

on:
  push:
    branches:
      - main
      - arena/01a040e4-cntract
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Supabase Repository Secrets into env.js
        run: |
          echo "/** Automatically injected by GitHub Actions with Repository Secrets **/" > env.js
          echo "window.ENV = {" >> env.js
          echo "  SUPABASE_URL: '${{ secrets.SUPABASE_URL }}'," >> env.js
          echo "  SUPABASE_ANON_KEY: '${{ secrets.SUPABASE_ANON_KEY }}'," >> env.js
          echo "  REQUIRE_AUTH_ON_START: true" >> env.js
          echo "};" >> env.js
          echo "Injected env.js successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
