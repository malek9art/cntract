# =========================================================================
#  المحتوى الكامل لملف:  .github/workflows/static.yml
#  انسخ هذا الملف كاملاً والصقه بدلاً من محتوى static.yml الحالي في مستودعك.
#
#  الفرق عن النسخة الافتراضية: خطوة حقن أسرار Supabase في env.js قبل النشر.
#  بدون هذه الخطوة يُنشر env.js فارغاً وتفشل شاشة تسجيل الدخول دائماً.
# =========================================================================
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1) التحقق من وجود أسرار المستودع
      # ---------------------------------------------------------------
      - name: Verify required repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::السر SUPABASE_URL غير موجود أو فارغ."
            missing=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::السر SUPABASE_ANON_KEY غير موجود أو فارغ."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::أضفهما من Settings > Secrets and variables > Actions ثم أعد تشغيل النشر."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL يجب أن يبدأ بـ https:// مثل https://xxxx.supabase.co"; exit 1 ;;
          esac
          echo "✅ السرّان موجودان. المضيف: $(echo "$SUPABASE_URL" | sed -E 's#https://([^/]+).*#\1#')"

      # ---------------------------------------------------------------
      # 2) توليد env.js وحقن المفاتيح
      # ---------------------------------------------------------------
      - name: Generate env.js from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')"
          CLEAN_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"
          export CLEAN_URL CLEAN_KEY

          node -e "
            const fs = require('fs');
            const q = JSON.stringify;
            const lines = [
              '/**',
              ' * Environment configuration - GENERATED BY GitHub Actions.',
              ' * Injected automatically from repository secrets. Do not edit by hand.',
              ' */',
              'window.ENV = {',
              '  SUPABASE_URL: ' + q(process.env.CLEAN_URL) + ',',
              '  SUPABASE_ANON_KEY: ' + q(process.env.CLEAN_KEY) + ',',
              '  REQUIRE_AUTH_ON_START: true,',
              '  CONFIG_SOURCE: \"github-secrets\",',
              '  BUILD_TIME: ' + q(new Date().toISOString()) + ',',
              '  BUILD_SHA: ' + q(process.env.GITHUB_SHA || '') + '',
              '};',
              ''
            ];
            fs.writeFileSync('env.js', lines.join('\n'));
          "

          echo "--- env.js (key masked) ---"
          sed -E 's/(SUPABASE_ANON_KEY: ")[^"]*/\1********/' env.js

      # ---------------------------------------------------------------
      # 3) كسر الكاش حتى لا يبقى المتصفح على نسخة قديمة بلا مفاتيح
      # ---------------------------------------------------------------
      - name: Cache-bust env.js and the service worker
        run: |
          STAMP="$(date +%s)"
          sed -i "s#src=\"env.js\"#src=\"env.js?v=${STAMP}\"#g" index.html
          sed -i "s#'./env.js'#'./env.js?v=${STAMP}'#g" sw.js
          sed -i "s#abuhudhayfah-cntract-v[0-9.]*#abuhudhayfah-cntract-${STAMP}#g" sw.js
          grep -n "env.js" index.html || true

      # ---------------------------------------------------------------
      # 4) منع نشر بناء معطوب
      # ---------------------------------------------------------------
      - name: Sanity check
        run: |
          test -f index.html || { echo "::error::index.html مفقود"; exit 1; }
          grep -q "supabase.co" env.js || { echo "::error::لم تُحقن المفاتيح في env.js"; exit 1; }
          if git diff --quiet -- env.js; then
            echo "::error::env.js لم يتغير - فشل حقن الأسرار"
            exit 1
          fi
          echo "✅ البناء سليم وجاهز للنشر."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
