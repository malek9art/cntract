name: Build & Deploy to GitHub Pages

# نشر النظام على GitHub Pages مع حقن مفاتيح Supabase من أسرار المستودع (Repository Secrets)
# المفاتيح المطلوبة:  SUPABASE_URL  و  SUPABASE_ANON_KEY
# Settings > Secrets and variables > Actions > New repository secret

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Inject secrets & build artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required repository secrets exist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          missing=0
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Repository secret SUPABASE_URL is missing or empty."
            missing=1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository secret SUPABASE_ANON_KEY is missing or empty."
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "::error::Add them in Settings > Secrets and variables > Actions, then re-run this workflow."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must start with https:// (e.g. https://xxxx.supabase.co)"; exit 1 ;;
          esac
          echo "Both secrets are present. URL host: $(echo "$SUPABASE_URL" | sed -E 's#https://([^/]+).*#\1#')"

      - name: Generate env.js from repository secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # تنظيف أي مسافات أو "/" زائدة في نهاية العنوان
          CLEAN_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]' | sed 's:/*$::')"
          CLEAN_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"

          node -e '
            const fs = require("fs");
            const url = process.argv[1];
            const key = process.argv[2];
            const out = `/**
 * Environment configuration - GENERATED BY GitHub Actions.
 * القيم أدناه محقونة تلقائياً من أسرار المستودع (Repository Secrets).
 * لا تُعدّل هذا الملف يدوياً ولا تضع فيه أي مفاتيح.
 */
window.ENV = {
  SUPABASE_URL: ${JSON.stringify(url)},
  SUPABASE_ANON_KEY: ${JSON.stringify(key)},
  REQUIRE_AUTH_ON_START: true,
  CONFIG_SOURCE: "github-secrets",
  BUILD_TIME: ${JSON.stringify(new Date().toISOString())},
  BUILD_SHA: ${JSON.stringify(process.env.GITHUB_SHA || "")}
};
`;
            fs.writeFileSync("env.js", out);
          ' "$CLEAN_URL" "$CLEAN_KEY"

          echo "--- generated env.js (key masked) ---"
          sed -E 's/(SUPABASE_ANON_KEY: ")[^"]{0,12}[^"]*/\1********/' env.js

      - name: Cache-bust env.js so browsers never serve a stale build
        run: |
          STAMP="$(date +%s)"
          sed -i "s#src=\"env.js\"#src=\"env.js?v=${STAMP}\"#g" index.html
          sed -i "s#'./env.js'#'./env.js?v=${STAMP}'#g" sw.js
          sed -i "s#abuhudhayfah-cntract-v[0-9.]*#abuhudhayfah-cntract-${STAMP}#g" sw.js
          grep -n "env.js" index.html || true

      - name: Sanity check the built site
        run: |
          test -f index.html || { echo "::error::index.html missing"; exit 1; }
          test -f env.js || { echo "::error::env.js was not generated"; exit 1; }
          grep -q "SUPABASE_URL" env.js || { echo "::error::env.js has no SUPABASE_URL"; exit 1; }
          # التأكد أن المفاتيح لم تُرفع داخل المستودع نفسه بالخطأ
          if git diff --quiet -- env.js; then
            echo "::error::env.js was not modified - secrets injection failed"
            exit 1
          fi
          echo "Build OK."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
